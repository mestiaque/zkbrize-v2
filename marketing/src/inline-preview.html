<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:590px;height:300px;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.p{width:590px;height:300px;position:relative;background:radial-gradient(120% 140% at 0% 0%,#1e3a8a 0%,#0f172a 60%);color:#fff;overflow:hidden}
.copy{position:absolute;left:28px;top:30px;width:250px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:rgba(56,189,248,.16);color:#7dd3fc;padding:4px 8px;border-radius:999px;margin-bottom:12px}
h1{font-size:34px;line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:14px;color:#cbd5e1;margin:0 0 16px;line-height:1.4}
ul{list-style:none;margin:0;padding:0}
li{font-size:12.5px;color:#e2e8f0;margin:0 0 7px;display:flex;gap:8px;align-items:center}
li i{width:16px;height:16px;border-radius:50%;background:#22c55e;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
li i:after{content:"";width:6px;height:3px;border-left:2px solid #0f172a;border-bottom:2px solid #0f172a;transform:rotate(-45deg) translate(1px,-1px)}
.foot{position:absolute;left:28px;bottom:22px;font-size:11px;color:#94a3b8}
.shot{position:absolute;left:300px;top:34px;width:430px;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);transform:perspective(900px) rotateY(-12deg) rotateX(4deg);transform-origin:left center}
.shot img{display:block;width:100%}
</style></head><body><div class="p">
<div class="copy">
  <div class="tag">For ZKTeco devices</div>
  <h1>ZK Bridge</h1>
  <p class="sub">Attendance from your ZKTeco devices, straight into your ERP.</p>
  <ul>
    <li><i></i>ADMS push &amp; TCP/IP devices</li>
    <li><i></i>Two-way ERP sync via REST API</li>
    <li><i></i>Live attendance analytics</li>
    <li><i></i>Windows &amp; Linux · setup wizard</li>
  </ul>
</div>
<div class="foot">Node.js · Works offline on your LAN</div>
<div class="shot"><img src="../screenshots/01-dashboard.png"></div>
</div></body></html>

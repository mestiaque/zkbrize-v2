name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: npm install (runs first-time setup)
        run: npm install --no-audit --no-fund

      - name: Use test port
        shell: bash
        run: |
          test -f .env
          sed -i 's/^PORT=.*/PORT=3200/' .env
          grep -q '^SESSION_SECRET=.\+' .env

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start TCP device emulators
        shell: bash
        run: |
          nohup python .github/ci/zk_emulator.py 14371 > emu1.log 2>&1 &
          nohup python .github/ci/zk_emulator.py 14372 1234 > emu2.log 2>&1 &
          sleep 2

      - name: Install wizard, auth, permissions, TCP devices, ping, restart
        env:
          ZK_EMU_PORT: '14371'
          ZK_EMU_KEY_PORT: '14372'
        run: node .github/ci/smoke.js full

      # ── Windows launchers ─────────────────────────────────────────
      - name: start.bat / stop.bat
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmd /c start.bat
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:3200/login -UseBasicParsing -TimeoutSec 2 | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content logs\server.log -ErrorAction SilentlyContinue; throw 'start.bat did not start the server' }
          cmd /c "stop.bat nopause"
          Start-Sleep 2
          $up = $true
          try { Invoke-WebRequest http://127.0.0.1:3200/login -UseBasicParsing -TimeoutSec 2 | Out-Null } catch { $up = $false }
          if ($up) { throw 'stop.bat did not stop the server' }
          Write-Host 'start.bat / stop.bat OK'
          exit 0

      - name: Windows service install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/service.js install 2>&1 | Tee-Object -FilePath logs/service-install.log
          for ($i = 0; $i -lt 30; $i++) { if ((sc.exe query zkbridge.exe) -match 'RUNNING') { break }; Start-Sleep 1 }
          sc.exe query zkbridge.exe
          if (-not ((sc.exe query zkbridge.exe) -match 'RUNNING')) { throw 'service is not running' }
          exit 0

      - name: Test against Windows service (incl. restart)
        if: runner.os == 'Windows'
        run: node .github/ci/smoke.js running

      - name: Windows service uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/service.js uninstall
          Start-Sleep 5
          $state = sc.exe query zkbridge.exe
          if ($LASTEXITCODE -ne 1060) { $state; throw 'service is still installed' }
          Write-Host 'service removed'
          exit 0

      # ── Linux launchers ───────────────────────────────────────────
      - name: start.sh / stop.sh
        if: runner.os == 'Linux'
        run: |
          ./start.sh
          curl -sf -o /dev/null http://127.0.0.1:3200/login
          ./stop.sh
          sleep 2
          ! curl -s -o /dev/null http://127.0.0.1:3200/login

      - name: systemd service install
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/service.js install
          sleep 3
          systemctl is-active zk-bridge

      - name: Test against systemd service (incl. restart)
        if: runner.os == 'Linux'
        run: node .github/ci/smoke.js running

      - name: systemd service uninstall
        if: runner.os == 'Linux'
        run: |
          sudo "$(command -v node)" scripts/service.js uninstall
          ! systemctl is-active zk-bridge

      # Logs as annotations, so failures are readable without downloading job logs
      - name: Server logs
        if: failure()
        shell: bash
        run: |
          annotate() {
            local title="$1" file="$2"
            [ -f "$file" ] || return 0
            local body
            body=$(tail -n 40 "$file" | sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$title::$body"
          }
          for f in logs/*.log src/daemon/*.log src/daemon/*.err.log src/daemon/*.out.log; do annotate "$(basename "$f")" "$f"; done
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo journalctl -u zk-bridge --no-pager -n 40 > /tmp/journal.log 2>&1 || true
            annotate journal /tmp/journal.log
          else
            sc.exe query zkbridge.exe > /tmp/sc.log 2>&1 || true
            annotate "sc query" /tmp/sc.log
            ls -la src/daemon > /tmp/daemon.log 2>&1 || true
            annotate "src/daemon" /tmp/daemon.log
          fi
